version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
  exclusions:
    rules:
      # Tests read and write their own temporary files.
      - path: _test\.go
        linters: [gosec]
        text: "G302|G304|G402|G703"

formatters:
  enable:
    - gofmt
    - goimports
