openapi: 3.1.0
info:
  title: Meerkat MFT API
  version: 0.0.0-draft
  description: |
    Draft of the orchestrator's public REST API for M1 and M2. Later milestones add users, roles, tokens, schedules, and webhooks.

    Everything reported by an agent is untrusted input. The orchestrator validates it, and clients must treat it as data, never as markup.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: https://orchestrator.example.internal/api/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: Service status.
  - name: Agents
    description: Enrollment and agent state.
  - name: Flows
    description: Flows, drafts, and approved versions.
  - name: Runs
    description: Runs and deliveries.
  - name: Audit
    description: Audit evidence.
  - name: Revocations
    description: Signed revocations.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      tags: [System]
      security: []
      responses:
        '200':
          description: The service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version:
                    type: string
        '503':
          $ref: '#/components/responses/Problem'
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      description: Agents in ID order. The cursor is the `next_cursor` of the previous page.
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_approval, approved, revoked]
      responses:
        '200':
          description: A page of agents.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  next_cursor:
                    type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /agents/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      summary: Create a one-use enrollment token
      description: The token enrolls one agent with this name, and expires after one hour. The workspace is created if it doesn't exist yet. For an agent that already exists, the token re-enrolls it, and works only with that agent's own keys, for example after a lost token or an expired connection certificate. A revoked agent gets 409.
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_name, workspace]
              properties:
                agent_name:
                  $ref: '#/components/schemas/Name'
                workspace:
                  $ref: '#/components/schemas/Name'
      responses:
        '201':
          description: The token, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getAgent
      summary: Get an agent
      tags: [Agents]
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/Problem'
  /agents/{agent_id}/identity:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    put:
      operationId: putAgentIdentity
      summary: Store a signed agent identity
      description: The CLI signs the identity, and storing it approves the agent. The orchestrator refuses a statement that is malformed or doesn't match the agent and its keys, stores the exact bytes, and passes them to the agent, which verifies them to its pinned trust root. Storing the same statement again changes nothing.
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedStatement'
      responses:
        '204':
          description: The identity was stored.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The agent is revoked or already has a different identity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /flows:
    get:
      operationId: listFlows
      summary: List flows
      tags: [Flows]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of flows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flow'
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createFlow
      summary: Create a flow
      description: The flow is empty until a version is saved, and runs nothing until a version is approved.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, workspace]
              properties:
                name:
                  $ref: '#/components/schemas/Name'
                workspace:
                  $ref: '#/components/schemas/Name'
      responses:
        '201':
          description: The new flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: The workspace already has a flow with this name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /flows/{flow_id}:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    get:
      operationId: getFlow
      summary: Get a flow
      tags: [Flows]
      responses:
        '200':
          description: The flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '404':
          $ref: '#/components/responses/Problem'
  /flows/{flow_id}/retirement:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    put:
      operationId: putFlowRetirement
      summary: Store a signed retirement
      description: |
        The CLI signs the retirement locally, as ADR 0024 defines, and it travels in the same form as an approval. The
        server stores it only if it verifies against the certificates and root key it carries and names this flow and its
        workspace. A retired flow takes no new drafts or approvals. Retiring a retired flow again changes nothing.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approval'
      responses:
        '204':
          description: The flow is retired.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /flows/{flow_id}/versions:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    post:
      operationId: createFlowVersion
      summary: Save a draft flow version
      description: |
        Saves the cards as the flow's next version. The server builds the payload an administrator approves, as ADR 0022
        defines, and refuses it with the reason when it is invalid. Every agent it names must be approved and in the
        flow's workspace. A draft never runs until it is approved.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowDefinition'
      responses:
        '201':
          description: The draft version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowVersion'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The flow is retired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /flows/{flow_id}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/FlowId'
      - $ref: '#/components/parameters/Version'
    get:
      operationId: getFlowVersion
      summary: Get a flow version
      tags: [Flows]
      responses:
        '200':
          description: The flow version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowVersion'
        '404':
          $ref: '#/components/responses/Problem'
  /flows/{flow_id}/versions/{version}/approval:
    parameters:
      - $ref: '#/components/parameters/FlowId'
      - $ref: '#/components/parameters/Version'
    put:
      operationId: putFlowApproval
      summary: Store a signed approval
      description: |
        The CLI signs the approval locally. The console has no way to create one. The server stores it only if it
        verifies against the certificates and root key it carries and signs exactly this version's payload, as ADR 0023
        defines. The server pins no root, so only agents decide whether the approval is trusted. Approving a version
        supersedes every older version, and approving an approved version again changes nothing.
      tags: [Flows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Approval'
      responses:
        '204':
          description: The version is approved.
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: A newer version is already approved, or the flow is retired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /flows/{flow_id}/runs:
    parameters:
      - $ref: '#/components/parameters/FlowId'
    post:
      operationId: startRun
      summary: Start a run
      tags: [Runs]
      responses:
        '202':
          description: The run was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /runs:
    post:
      operationId: startManualRun
      summary: Start a manual run
      description: >-
        Moves one file from the source agent's outbox to the destination agent's inbox, without a flow. Both agents
        must be approved and in the same workspace. The run starts `pending` and waits until both agents are
        connected and the source claims its side. The file name is a bare name, never a path. Manual runs are for
        M1, before flows exist. See ADR 0021 and ADR 0026.
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_agent_id, destination_agent_id, file_name]
              properties:
                source_agent_id:
                  $ref: '#/components/schemas/Id'
                destination_agent_id:
                  $ref: '#/components/schemas/Id'
                file_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: >-
                    A bare file name: no path separator, colon, NUL, or control character, not `.` or `..`, not ending
                    in a dot or space, and not a Windows device name such as `CON`.
      responses:
        '202':
          description: The run was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: Get a run and its deliveries
      tags: [Runs]
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /audit/checkpoints:
    get:
      operationId: listAuditCheckpoints
      summary: List audit checkpoints
      tags: [Audit]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of checkpoints.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignedStatement'
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Problem'
  /revocations:
    post:
      operationId: createRevocation
      summary: Publish a signed revocation
      tags: [Revocations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedStatement'
      responses:
        '204':
          description: The revocation was stored.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FlowId:
      name: flow_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Problem:
      description: An error, in RFC 9457 format.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
    Name:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,128}$'
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    SignedStatement:
      type: object
      description: A DSSE envelope, as defined in ADR 0012.
      required: [payload, payloadType, signatures]
      properties:
        payload:
          type: string
          contentEncoding: base64
        payloadType:
          type: string
          maxLength: 128
        signatures:
          type: array
          minItems: 2
          items:
            type: object
            required: [sig]
            properties:
              keyid:
                type: string
                maxLength: 128
              sig:
                type: string
                contentEncoding: base64
    Agent:
      type: object
      required: [id, name, workspace, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        workspace:
          $ref: '#/components/schemas/Name'
        status:
          type: string
          description: Presence states arrive with the agent connection.
          enum: [pending_approval, approved, online, offline, revoked, identity_expired]
        public_keys:
          description: The agent's current public keys, from which the CLI recomputes its fingerprint. Untrusted until compared with the host.
          type: object
          required: [ed25519, mldsa65, encryption_recipient]
          properties:
            ed25519:
              type: string
              contentEncoding: base64
            mldsa65:
              type: string
              contentEncoding: base64
            encryption_recipient:
              type: string
              maxLength: 4096
        agent_version:
          type: string
          maxLength: 64
        identity_expires_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    Flow:
      type: object
      required: [id, name, workspace, retired]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        workspace:
          $ref: '#/components/schemas/Name'
        approved_version:
          type: integer
        latest_version:
          type: integer
        retired:
          type: boolean
    FlowDefinition:
      type: object
      description: |
        The flow's tree of cards. The orchestrator adds the flow's ID, workspace, version number, and agents to make the
        payload an administrator approves, defined in `flow-version.schema.json`. See ADR 0022.
      additionalProperties: false
      required: [schema_version, cards]
      properties:
        schema_version:
          type: integer
          const: 1
        cards:
          $ref: './flow-version.schema.json#/$defs/cards'
    FlowVersion:
      type: object
      required: [flow_id, version, status, definition, payload, payload_sha256]
      properties:
        flow_id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
        status:
          type: string
          enum: [draft, approved, superseded]
        definition:
          $ref: '#/components/schemas/FlowDefinition'
        payload:
          description: The exact payload an administrator approves, as defined in `flow-version.schema.json`.
          type: string
          contentEncoding: base64
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        approval:
          $ref: '#/components/schemas/Approval'
    Approval:
      type: object
      description: A signed statement with its signers' administrator certificates and the root key that issued them, as ADR 0023 defines.
      additionalProperties: false
      required: [statement, administrator_certificates, root_ed25519, root_mldsa65]
      properties:
        statement:
          $ref: '#/components/schemas/SignedStatement'
        administrator_certificates:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/SignedStatement'
        root_ed25519:
          type: string
          contentEncoding: base64
        root_mldsa65:
          type: string
          contentEncoding: base64
    Run:
      type: object
      required: [id, flow_id, flow_version, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        flow_id:
          description: Null for a manual run.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        flow_version:
          description: Null for a manual run.
          type: [integer, 'null']
        status:
          type: string
          description: >-
            `pending` until an agent claims the first delivery, then `running`. Once every delivery has ended, the run
            is `succeeded` if all succeeded, `failed` if none did, and `partial_failure` otherwise. See ADR 0026.
          enum: [pending, running, succeeded, partial_failure, failed, cancelled]
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
    Delivery:
      type: object
      required: [id, status, evidence]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        source_agent_id:
          $ref: '#/components/schemas/Id'
        destination_agent_id:
          $ref: '#/components/schemas/Id'
        file_name:
          type: string
          description: >-
            For a manual run, the name the administrator gave. For a flow, reported by an agent. Untrusted, may be
            personal data, and is missing once retention has deleted it.
          maxLength: 1024
        size_bytes:
          type: integer
        sealed_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          type: string
          description: >-
            `pending` until the source claims it, `claimed` while the source seals the file, `transferring` once the
            manifest is stored, `verifying` once the destination holds the whole sealed file, and `succeeded` once
            its receipt matches. Any of these can end in `failed`, with an `error_code`. See ADR 0026.
          enum: [pending, claimed, transferring, verifying, retry_wait, succeeded, failed, cancelled]
        evidence:
          type: string
          enum: [none, source_only, verified]
        error_code:
          type: string
          maxLength: 64
