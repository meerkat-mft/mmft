# A local test lab. Each agent sits on its own network, so agents can reach the
# orchestrator and relay but not each other, as ADR 0001 requires.
name: mmft-lab

x-service: &service
  build:
    context: ..
    dockerfile: lab/Dockerfile
  image: mmft-lab
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

x-agent: &agent
  <<: *service
  tmpfs:
    # A small spool, so that full-disk tests are quick, and the outbox and
    # inbox that manual deliveries use.
    - /var/lib/mmft/spool:size=16m,uid=10001,mode=0700
    - /var/lib/mmft/outbox:size=16m,uid=10001,mode=0700
    - /var/lib/mmft/inbox:size=16m,uid=10001,mode=0700

services:
  orchestrator:
    <<: *service
    hostname: orchestrator
    networks: [site-a, site-b, core]
    environment:
      MMFT_DATABASE_URL: postgres://mmft:lab-only-not-a-secret@postgres:5432/mmft?sslmode=disable
      MMFT_CA_DIR: /var/lib/mmft/ca
      MMFT_SERVER_NAMES: orchestrator
      # SHA-256 of the lab placeholder admin token in enroll.sh.
      MMFT_ADMIN_TOKEN_SHA256: 979764906a9c6981445fc9d6c48070eb0e4400f274714e09dbfdc70176c34caf
    volumes:
      - orchestrator-ca:/var/lib/mmft/ca
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    <<: *service
    hostname: relay
    networks: [site-a, site-b, core]
    environment:
      MMFT_RELAY_DIR: /var/lib/mmft/relay
      MMFT_CONNECTION_CA: /var/lib/mmft/relay/connection-ca.crt
    volumes:
      - relay:/var/lib/mmft/relay

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mmft
      POSTGRES_USER: mmft
      POSTGRES_PASSWORD: lab-only-not-a-secret
    networks: [core]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmft -d mmft"]
      interval: 1s
      timeout: 2s
      retries: 30

  # An administrator's machine, which holds the trust root and administrator
  # key. It reaches only the orchestrator's API.
  admin:
    <<: *service
    hostname: admin
    networks: [core]
    tmpfs:
      - /var/lib/mmft/admin:size=16m,uid=10001,mode=0700

  agent-a:
    <<: *agent
    hostname: agent-a
    networks: [site-a]
    volumes:
      - agent-a:/var/lib/mmft/agent

  agent-b:
    <<: *agent
    hostname: agent-b
    networks: [site-b]
    volumes:
      - agent-b:/var/lib/mmft/agent

# Keys and state survive a container restart, as on a real host.
volumes:
  orchestrator-ca:
  relay:
  agent-a:
  agent-b:

networks:
  core:
    internal: true
  site-a:
    internal: true
  site-b:
    internal: true
