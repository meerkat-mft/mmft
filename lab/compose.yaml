# A local test lab. Each agent sits on its own network, so agents can reach the
# orchestrator and relay but not each other, as ADR 0001 requires.
name: mmft-lab

x-service: &service
  build:
    context: ..
    dockerfile: lab/Dockerfile
  image: mmft-lab
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true

x-agent: &agent
  <<: *service
  tmpfs:
    # A small spool, so that full-disk tests are quick.
    - /var/lib/mmft/spool:size=16m,uid=10001,mode=0700

services:
  orchestrator:
    <<: *service
    hostname: orchestrator
    networks: [site-a, site-b, core]

  relay:
    <<: *service
    hostname: relay
    networks: [site-a, site-b, core]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mmft
      POSTGRES_USER: mmft
      POSTGRES_PASSWORD: lab-only-not-a-secret
    networks: [core]
    tmpfs:
      - /var/lib/postgresql

  agent-a:
    <<: *agent
    hostname: agent-a
    networks: [site-a]

  agent-b:
    <<: *agent
    hostname: agent-b
    networks: [site-b]

networks:
  core:
    internal: true
  site-a:
    internal: true
  site-b:
    internal: true
