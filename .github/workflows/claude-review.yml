name: Claude review

# Reviews every pull request with Claude Code's code-review skill, billed to
# the maintainer's Claude subscription through CLAUDE_CODE_OAUTH_TOKEN (made
# with `claude setup-token`). Findings are posted as inline comments, or as one
# summary comment when there are none; the skill reads CLAUDE.md from the
# checkout.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    # GitHub withholds secrets from fork pull requests, so only branches in
    # this repository are reviewed. The condition makes that skip explicit.
    # The skill skips drafts, so they are reviewed when marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action runs headless, so any tool not listed here is refused
          # and the plugin's own allowed-tools list does not apply. Read, Grep,
          # Glob, and subagents need no entry. Each allowed tool:
          # - gh pr view: reads the pull request, its state, and its comments,
          #   to skip closed, draft, or already reviewed pull requests.
          # - gh pr diff: reads the changes to review.
          # - gh pr comment: posts the summary comment when there are no
          #   findings.
          # - create_inline_comment: posts each finding on its line. The
          #   server behind it starts only when this tool is listed.
          # Each rule matches only a single command, so a pipe, redirect, or
          # chain is refused. Rather than allow grep, git, or gh api, which a
          # crafted pull request could steer outside the checkout, the
          # appended prompt points the reviewer at the checked-out files.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "The pull request is already checked out in the working directory, so read the changed files and their context with the Read, Grep, and Glob tools. Use Bash only for single gh pr view, gh pr diff, and gh pr comment commands, with no pipes, redirects, chained commands, or other programs. Anything else is refused and fails the review. If a diff is too long to read at once, list its files with gh pr diff --name-only and read each one with Read. Give these rules to every subagent you launch."
      # A refused tool does not fail the action, so a review that could not
      # read or post anything used to pass green. This prints only the refused
      # tool and the start of its command, never the model's output.
      - name: Fail on refused tools
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          denials=$(jq -c '[.[] | select(.type == "result") | (.permission_denials // [])[]]' "$EXECUTION_FILE")
          count=$(jq length <<<"$denials")
          echo "Refused tool calls: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.[] | "::error::Refused \(.tool_name): \((.tool_input.command // "") | .[0:100])"' <<<"$denials"
            exit 1
          fi
      # The skill posts nothing when it skips a pull request it has already
      # reviewed, so this passes once any review by Claude is on it. Like the
      # step above, it runs only when Claude ran: the action skips itself on a
      # pull request that changes this file, because its token is issued only
      # for the workflow on main.
      - name: Check a review was posted
        if: steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' | jq -s add)
          inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' | jq -s add)
          echo "Comments by Claude: $comments summary, $inline inline"
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::The review posted nothing on this pull request."
            exit 1
          fi
