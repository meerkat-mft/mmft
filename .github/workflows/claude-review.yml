name: Claude review

# Reviews every pull request with Claude Code's code-review skill, billed to
# the maintainer's Claude subscription through CLAUDE_CODE_OAUTH_TOKEN (made
# with `claude setup-token`). Findings are posted as inline comments; the
# skill reads CLAUDE.md from the checkout.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    # GitHub withholds secrets from fork pull requests, so only branches in
    # this repository are reviewed. The condition makes that skip explicit.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required: the server that posts inline comments starts only when
          # this tool is allowed here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
