name: Claude review

# Reviews every pull request with Claude Code's code-review skill, billed to
# the maintainer's Claude subscription through CLAUDE_CODE_OAUTH_TOKEN (made
# with `claude setup-token`). Findings are posted as inline comments, or as one
# summary comment when there are none; the skill reads CLAUDE.md from the
# checkout.
#
# The skill stops when Claude has already commented on a pull request. So that
# each push is still reviewed, a push that only adds commits to a reviewed pull
# request gets a review of just those commits. A run that fails is re-run, which
# reviews the same push again.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  review:
    # GitHub withholds secrets from fork pull requests, so only branches in
    # this repository are reviewed. The condition makes that skip explicit.
    # The skill skips drafts, so they are reviewed when marked ready.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # Runs without the model. On a pull request Claude has not reviewed, the
      # skill reviews all of it. On a push to one it has reviewed, this
      # compares the reviewed head (event.before) with the new head. When the
      # push only added commits, it saves their diff inside .git, where no
      # pull request can put a file, keeping only files the pull request
      # changes, so a merge from main is not reviewed. After a force push the
      # whole pull request is reviewed again. Other events on a reviewed pull
      # request are skipped.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' | jq -s add)
          inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]")] | length' | jq -s add)
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "Claude has not reviewed this pull request yet, so the whole pull request is reviewed."
            exit 0
          fi
          if [ "$EVENT" != synchronize ]; then
            # The skill would stop on the earlier review, so skip without
            # spending a run on it.
            echo "Claude has already reviewed this pull request, and $EVENT adds no commits to review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir=.git/claude-review
          mkdir -p "$dir"
          if gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" > "$dir/compare.json" &&
            [ "$(jq -r .status "$dir/compare.json")" = ahead ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | jq -R . | jq -s . > "$dir/pr-files.json"
            jq -r --slurpfile pr "$dir/pr-files.json" '.files[]
              | select(.filename as $f | any($pr[0][]; . == $f))
              | "diff --git a/\(.previous_filename // .filename) b/\(.filename)\n--- a/\(.previous_filename // .filename)\n+++ b/\(.filename)\n\(.patch // "(No patch: the change is binary or too large. Read the file.)")"' \
              "$dir/compare.json" > "$dir/new-commits.diff"
            files=$(grep -c '^diff --git' "$dir/new-commits.diff" || true)
            echo "Reviewing the commits from $BEFORE to $AFTER: $files changed files in this pull request."
            if [ "$files" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "instructions=Claude already reviewed this pull request up to commit $BEFORE, and this run reviews only the commits pushed since then, up to $AFTER. Earlier comments by Claude, and new commits that look small, are not a reason to stop. In place of gh pr diff, read the diff of the new commits from $dir/new-commits.diff with Read, and give subagents that path. Flag only issues in lines that diff adds or changes, and post each inline comment on such a line." >> "$GITHUB_OUTPUT"
          else
            echo "The push replaced reviewed commits, so the whole pull request is reviewed again."
            echo "instructions=New commits replaced the ones Claude reviewed, so earlier comments by Claude are not a reason to stop. Review the whole pull request." >> "$GITHUB_OUTPUT"
          fi
      - id: review
        if: steps.scope.outputs.skip != 'true'
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action runs headless, so any tool not listed here is refused
          # and the plugin's own allowed-tools list does not apply. Read, Grep,
          # Glob, and subagents need no entry. Each allowed tool:
          # - gh pr view: reads the pull request, its state, and its comments,
          #   to skip closed, draft, or already reviewed pull requests. The
          #   scope step's instructions lift the last skip for a new push.
          # - gh pr diff: reads the changes to review.
          # - gh pr comment: posts the summary comment when there are no
          #   findings.
          # - create_inline_comment: posts each finding on its line. The
          #   server behind it starts only when this tool is listed.
          # Each rule matches only a single command, so a pipe, redirect, or
          # chain is refused. Rather than allow grep, git, or gh api, which a
          # crafted pull request could steer outside the checkout, the
          # appended prompt points the reviewer at the checked-out files.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "The pull request is already checked out in the working directory, so read the changed files and their context with the Read, Grep, and Glob tools. Use Bash only for single gh pr view, gh pr diff, and gh pr comment commands, with no pipes, redirects, chained commands, or other programs. Anything else is refused and fails the review. If a diff is too long to read at once, list its files with gh pr diff --name-only and read each one with Read. Give these rules to every subagent you launch. ${{ steps.scope.outputs.instructions }}"
      # A refused tool does not fail the action, so a review that could not
      # read or post anything used to pass green. This prints only the refused
      # tool and the start of its command, never the model's output.
      - name: Fail on refused tools
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          denials=$(jq -c '[.[] | select(.type == "result") | (.permission_denials // [])[]]' "$EXECUTION_FILE")
          count=$(jq length <<<"$denials")
          echo "Refused tool calls: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.[] | "::error::Refused \(.tool_name): \((.tool_input.command // "") | .[0:100])"' <<<"$denials"
            exit 1
          fi
      # Passes only when this run posted a comment, since every review posts
      # findings or a summary. Like the step above, it runs only when Claude
      # ran: the action skips itself on a pull request that changes this file,
      # because its token is issued only for the workflow on main.
      - name: Check a review was posted
        if: steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.scope.outputs.started }}
        run: |
          mine='[.[] | select(.user.login == "claude[bot]" and .created_at >= env.STARTED)] | length'
          comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq "$mine" | jq -s add)
          inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate --jq "$mine" | jq -s add)
          echo "Comments by Claude in this run: $comments summary, $inline inline"
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::The review posted nothing in this run."
            exit 1
          fi
